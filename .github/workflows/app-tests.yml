name: App tests

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/app-tests.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx jest --ci
